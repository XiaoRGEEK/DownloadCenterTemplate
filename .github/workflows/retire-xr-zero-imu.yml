name: Retire XR-ZERO-IMU public firmware

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PURGE-XR-ZERO-IMU-PUBLIC-FIRMWARE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tos-maintenance
  cancel-in-progress: false

jobs:
  purge:
    environment: tos-maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected master
        uses: actions/checkout@v7

      - name: Verify retired control plane and exact confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "PURGE-XR-ZERO-IMU-PUBLIC-FIRMWARE"
          test "$(python3 scripts/validate_release.py --print-objects | grep -c '^firmware/xr-zero-imu/' || true)" = "0"

      - name: Install and configure tosutil
        env:
          TOS_ENDPOINT: ${{ secrets.TOS_ENDPOINT }}
          TOS_REGION: ${{ secrets.TOS_REGION }}
          TOS_ACCESS_KEY_ID: ${{ secrets.TOS_ACCESS_KEY_ID }}
          TOS_SECRET_ACCESS_KEY: ${{ secrets.TOS_SECRET_ACCESS_KEY }}
          TOS_SECURITY_TOKEN: ${{ secrets.TOS_SECURITY_TOKEN }}
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/tosutil-bin"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${install_dir}/tosutil" \
            https://tos-tools.tos-cn-beijing.volces.com/linux/amd64/tosutil
          chmod 0755 "${install_dir}/tosutil"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          args=(config "-e=${TOS_ENDPOINT}" "-re=${TOS_REGION}" \
            "-i=${TOS_ACCESS_KEY_ID}" "-k=${TOS_SECRET_ACCESS_KEY}")
          if [[ -n "${TOS_SECURITY_TOKEN:-}" ]]; then
            args+=("-t=${TOS_SECURITY_TOKEN}")
          fi
          "${install_dir}/tosutil" "${args[@]}"

      - name: Permanently purge the exact XR-ZERO-IMU prefix
        env:
          TOS_BUCKET: ${{ secrets.TOS_BUCKET }}
        run: |
          set -euo pipefail
          prefix="tos://${TOS_BUCKET}/firmware/xr-zero-imu/"
          tosutil ls "${prefix}" -v -bf=raw -limit=1000
          tosutil rm "${prefix}" -r -v -f -j=1
          result=$(tosutil ls "${prefix}" -v -bf=raw -limit=1000)
          printf '%s\n' "${result}"
          grep -q 'Versioning file number is: 0' <<<"${result}"
          grep -q 'DeleteMarker number is: 0' <<<"${result}"

      - name: Verify public objects are unavailable
        run: |
          set -euo pipefail
          for object in \
            firmware/xr-zero-imu/version.yaml \
            firmware/xr-zero-imu/production.yaml \
            firmware/xr-zero-imu/app_2.1.5.0.bin \
            firmware/xr-zero-imu/xr-zero-imu-bl2.0.0.1-app2.1.5.0-production.zip \
            firmware/xr-zero-imu/f030/layout3/2s/version.yaml \
            firmware/xr-zero-imu/f030/layout3/2s/app_0.1.0.4.bin \
            firmware/xr-zero-imu/f030/layout3/2s/app_0.1.0.6.bin \
            firmware/xr-zero-imu/f030/layout3/3s/version.yaml \
            firmware/xr-zero-imu/f030/layout3/3s/app_0.1.0.4.bin \
            firmware/xr-zero-imu/f030/layout3/3s/app_0.1.0.6.bin; do
            status=$(curl --silent --show-error --location --output /dev/null \
              --write-out '%{http_code}' "https://software.xiao-r.com/${object}")
            test "${status}" = "404"
          done
