name: Deploy static download center to Pages

on:
  workflow_run:
    workflows: ["Publish release assets and deploy metadata to TOS"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate release manifests
        run: python3 scripts/validate_release.py
      - name: Assemble site without repository controls
        run: |
          set -euo pipefail
          mkdir -p _site/software _site/docs
          cp index.html style.css logo.png data.json _site/
          cp -R software/image software/ios _site/software/
          cp -R docs/. _site/docs/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
